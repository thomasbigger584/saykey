name: saykey

# Base (CPU) definition. scripts/run-server.ps1 adds docker-compose.gpu.yml when
# an NVIDIA GPU is available. From this server/ directory you can also run:
#   docker compose up -d --build                       (CPU)
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# Relative paths (build context, ./models volume) resolve against server/, so the
# model cache lands in ../models at the project root.

services:
  asr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ORT_PACKAGE: ${ORT_PACKAGE:-onnxruntime}
        INSTALL_HF: ${INSTALL_HF:-false}
        CUDA_IMAGE: ${CUDA_IMAGE:-nvidia/cuda:12.4.1-cudnn-runtime-ubuntu22.04}
    image: ${ASR_IMAGE:-saykey-asr:latest}
    container_name: saykey-asr
    ports:
      - "${ASR_PORT:-9000}:9000"
    environment:
      ASR_ENGINE: ${ASR_ENGINE:-parakeet}
      ASR_MODEL: ${ASR_MODEL:-}
      ASR_DEVICE: ${ASR_DEVICE:-auto}
      ASR_QUANTIZATION: ${ASR_QUANTIZATION:-none}
      ASR_UPSTREAM_URL: ${ASR_UPSTREAM_URL:-}
      ASR_UPSTREAM_KEY: ${ASR_UPSTREAM_KEY:-}
      ASR_PRELOAD: "1"
      HF_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - ../models:/models
    restart: unless-stopped
