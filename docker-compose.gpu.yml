# GPU overlay -- merged on top of docker-compose.yml by run-server.ps1 when an
# NVIDIA GPU is detected. Requires Docker Desktop with GPU support / the NVIDIA
# Container Toolkit.

services:
  asr:
    build:
      args:
        ORT_PACKAGE: onnxruntime-gpu
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
