; ===========================================================================
;  Saykey configuration
;  Copy to config.ini (install.ps1 does this) and edit as needed.
;  Comments must be on their own line -- never after a value on the same line.
; ===========================================================================

[general]
; Python interpreter that runs record.py (audio capture + the local fallback).
; Relative paths are resolved against this folder.
python = .venv\Scripts\pythonw.exe
; Language code (en, de, fr, ...) or "auto".
language = en
; Where the local fallback model is cached.
models_dir = models
; true = the local fallback never touches the network (model must be present).
; install.ps1 flips this to true once base.en is downloaded.
offline = false
; Verbose logging to %TEMP%\saykey.log (state transitions, toast geometry,
; live audio levels for tuning silence_threshold). Also toggled from the tray.
debug = false

[transcription]
; backend = where audio is turned into text:
;   server - POST audio to the ASR HTTP server (Docker container, runs Parakeet
;            on the GPU). Recommended. Also works with any OpenAI-compatible ASR
;            endpoint (speaches, an NVIDIA Riva gateway, a remote box, a cloud API).
;   local  - transcribe in-process with faster-whisper (CPU only, no server).
backend = server
; Base URL of the ASR server.
server_url = http://127.0.0.1:9000
; Model name sent in the request. With the bundled server this is informational
; (the server loads whatever [server] engine says) unless engine = openai.
server_model = parakeet
; Seconds to wait for a transcription response.
server_timeout = 30
; Bearer token, only needed for a remote / cloud endpoint.
server_api_key =
; If the server is unreachable, fall back to in-process faster-whisper.
fallback_to_local = true

[server]
; ---- consumed by run-server.ps1 / docker compose: the SERVER-SIDE model choice.
; Change engine (or model) here, then:  .\run-server.ps1 restart
;
; engine aliases:
;   parakeet       -> onnx-asr  nemo-parakeet-tdt-0.6b-v2   (English, recommended)
;   parakeet-v3    -> onnx-asr  nemo-parakeet-tdt-0.6b-v3   (25 languages)
;   parakeet-ctc   -> onnx-asr  nemo-parakeet-ctc-0.6b
;   canary         -> onnx-asr  nemo-canary-1b-v2           (multilingual)
;   whisper        -> faster-whisper  (set model = large-v3 / small.en / ...)
; generic forms:
;   onnx:<id>      -> any onnx-asr model id
;   fw:<id>        -> any faster-whisper model id
;   hf:<repo/id>   -> any HuggingFace ASR model via transformers
;                     (needs the image built with -Hf; covers Parakeet, Whisper,
;                      wav2vec2, MMS, ... basically "any model")
;   openai         -> forward to another OpenAI-compatible server
;                     (set upstream_url / upstream_key below)
engine = parakeet
; Optional explicit checkpoint id, overrides the engine's default model.
model =
; cuda | cpu | auto
device = auto
; none | int8   (int8 = smaller + faster, slightly lower accuracy)
quantization = none
; Host port the server is exposed on.
port = 9000
; Container image tag.
image = saykey-asr:latest
; engine = openai only: the upstream endpoint this server forwards to.
upstream_url =
upstream_key =

[local]
; faster-whisper settings for backend = local, and for engine = whisper.
model = base.en
compute_type = int8
beam_size = 1

[recording]
; Hard safety cap on one recording, seconds.
max_seconds = 60
; Auto-stop after this many seconds of trailing silence. 0 = toggle only.
silence_timeout = 2.0
; RMS level (0..1) treated as silence. Raise in a noisy room.
silence_threshold = 0.012
; Input device index from the tray "List audio devices" menu. -1 = default.
device_index = -1

[injection]
; How the transcript is typed into the focused window:
;   Raw   - SendInput scan-code stream (fast; default)
;   Event - paced scan-codes with a per-key delay (most VDI-compatible)
;   Text  - Unicode events (non-Latin text / non-US guest layouts)
mode = Raw
key_delay = 10
chunk_size = 20
chunk_delay = 15
trailing_space = true
trim = true
normalize_ascii = true
collapse_newlines = true

[toast]
; On-screen indicator. Appears the instant you press the key ("starting"),
; switches to "RECORDING" once the mic is actually live, and disappears when
; you release the key / recording stops. It never takes keyboard focus.
enabled = true
; bottom | top | center | bottom-left | bottom-right | top-left | top-right
position = bottom
; pixels from the screen edge
margin = 90
; text size (pt)
font_size = 12

[hotkey]
; mode = hold   -> push-to-talk: hold the key to record, release to transcribe
;                  and insert. (Recommended.)
;        toggle -> press once to start, press again to stop.
mode = hold
; hold mode only: ignore presses shorter than this (ms) so an accidental tap
; doesn't fire a recording.
min_hold_ms = 250
; The dictation key. AutoHotkey syntax:  ^ = Ctrl  ! = Alt  + = Shift  # = Win
; Note: Ctrl+Space (^Space) can clash with IME / input-language switching and
; with some editors' autocomplete -- try ^!Space or #Space if it misbehaves.
key = ^Space
; Cancel the current recording without transcribing (both modes).
cancel = ^+Space
; After changing anything here: tray menu -> Reload.

[button]
; Floating on-screen trigger, driven by the MOUSE. Enable it for remote-desktop
; clients (Omnisa / VMware Horizon, Citrix) that capture the keyboard so
; completely that no hotkey fires while their window has focus -- neither a
; low-level hook nor the raw-input API can see the key there, but a mouse click
; on a separate host window is unaffected.
;   left-click + hold = talk   (in mode = toggle: click once = start, click = stop)
;   right-click + drag = move   (the new spot is saved back here as x / y)
; It never takes keyboard focus off the VDI. Also toggled from the tray menu.
enabled = false
; bottom-right | bottom-left | top-right | top-left | top | bottom | center
position = bottom-right
; pixels from the screen edge (ignored once you've dragged it -- x / y win)
margin = 28
; label text size (pt)
font_size = 11
; explicit position in screen pixels; set automatically when you drag the button.
; remove these (or set both to -1) to go back to `position`.
; x = -1
; y = -1
